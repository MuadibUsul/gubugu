# VPS 生产编排：自建 Postgres + 一次性迁移 + Next 应用。
#
# ⚠️ 这台机器上已经跑着 tline（tline-app / tline-db-1 / caddy-caddy-1）。
# 本文件按“绝不干扰既有服务”设计：
#   - compose 项目名固定 gubugu，容器/卷/网络全部独立，不复用 tline 的任何资源；
#   - 不发布任何宿主机端口。宿主机的 caddy-caddy-1 独占 80/443，它通过共享的
#     外部网络 `web` 用容器名直接访问 gubugu-app:3000，因此无需端口映射；
#   - Postgres 只接在内部网络，`web` 网络上的其它容器访问不到它；
#   - 每个服务设内存上限，避免挤垮同机的 tline（整机 6 GB）。
#
# 变量来自同目录 .env（见 .env.production.example）。

name: gubugu

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    # 仅内部网络：不加入 web，代理层碰不到数据库。
    networks: [internal]
    mem_limit: 768m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gubugu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须在 .env 中设置}
      POSTGRES_DB: ${POSTGRES_DB:-gubugu}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gubugu} -d ${POSTGRES_DB:-gubugu}']
      interval: 5s
      timeout: 5s
      retries: 10

  # 一次性跑数据库迁移，成功退出后 web 才启动。
  migrate:
    image: ${MIGRATOR_IMAGE:?MIGRATOR_IMAGE 未设置}
    restart: 'no'
    networks: [internal]
    mem_limit: 768m
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gubugu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gubugu}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE 未设置}
    restart: unless-stopped
    # 固定容器名：宿主机 Caddy 的 reverse_proxy 靠这个名字解析。
    container_name: gubugu-app
    # internal 连数据库，web 供 Caddy 反代。不发布任何端口。
    networks: [internal, web]
    # CLIP 模型（fp32）常驻约 1 GB，加 Next 运行时；留出余量给 tline。
    mem_limit: 2560m
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-gubugu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gubugu}
      APP_URL: ${APP_URL:?APP_URL 必须设置为 https://你的域名}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Gooods Dex}
      # 认证：自托管在本机，不依赖 Supabase。会话 cookie 由这个密钥 HMAC 签名，
      # 缺失或过短会让每个请求抛错，因此强制要求（见 server/env.ts）。
      LOCAL_AUTH_SECRET: ${LOCAL_AUTH_SECRET:?必须设置至少 32 位的 LOCAL_AUTH_SECRET}
      # 留空即走本地认证；将来若要接 Supabase，填上这两项即可自动切换过去。
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      ADMIN_USER_EMAILS: ${ADMIN_USER_EMAILS:-}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      MODERATOR_USER_EMAILS: ${MODERATOR_USER_EMAILS:-}
      MODERATOR_USER_IDS: ${MODERATOR_USER_IDS:-}
      RECOGNITION_WARMUP: ${RECOGNITION_WARMUP:-1}
      CATALOG_CRAWLER_SCHEDULER: ${CATALOG_CRAWLER_SCHEDULER:-1}
      CATALOG_ASSET_DIR: /app/.data/catalog-assets
      MODEL_CACHE_DIR: /app/.data/models
      HF_MIRROR: ${HF_MIRROR:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      CATALOG_TRANSLATE_MODEL: ${CATALOG_TRANSLATE_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    volumes:
      - catalog_assets:/app/.data/catalog-assets
      - model_cache:/app/.data/models
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      # 开了 RECOGNITION_WARMUP 时首启要下载并加载 CLIP，给足冷启动时间。
      start_period: 300s

networks:
  # 本项目专属网络。
  internal:
    name: gubugu_internal
  # 宿主机上已存在的共享代理网络，由 caddy-caddy-1 使用。external 表示
  # 只接入、不创建也不管理它——compose down 不会删掉它。
  web:
    external: true
    name: web

volumes:
  pgdata:
  catalog_assets:
  model_cache:
