name: Deploy to VPS

# CI 已验证并发布同一 main commit 的镜像；这里仅负责部署，不再重复构建。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  # 所有生产发布共用一把锁。不同 SHA 不能同时修改同一份 .env、容器和镜像。
  group: gubugu-production-deploy
  cancel-in-progress: false
  queue: max

jobs:
  build-and-deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # GHCR 要求全小写的 owner。
      - name: Resolve image names
        id: img
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "base=ghcr.io/${owner}/gubugu" >> "$GITHUB_OUTPUT"
          echo "sha=${DEPLOY_SHA::12}" >> "$GITHUB_OUTPUT"

      # 把编排文件同步到 VPS（.env 与密钥只在 VPS 上手动维护，不经 CI）。
      - name: Copy compose files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: 'docker-compose.yml,ops/backup-production.sh'
          target: ${{ secrets.DEPLOY_DIR }}

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          WEB_IMAGE: ${{ steps.img.outputs.base }}-web:${{ steps.img.outputs.sha }}
          MIGRATOR_IMAGE: ${{ steps.img.outputs.base }}-migrator:${{ steps.img.outputs.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_OWNER: ${{ steps.img.outputs.owner }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: WEB_IMAGE,MIGRATOR_IMAGE,REGISTRY_USER,REGISTRY_TOKEN,REGISTRY_OWNER
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_DIR }}"

            # GitHub concurrency 防正常流水线并发；宿主机文件锁同时防手动发布撞车。
            exec 9>.deploy.lock
            flock -w 900 9

            # 用本次构建的不可变 sha 标签覆盖 .env 里的镜像坐标。
            touch .env
            cp .env .env.previous
            grep -v -E '^(WEB_IMAGE|MIGRATOR_IMAGE)=' .env > .env.next || true
            echo "WEB_IMAGE=${WEB_IMAGE}" >> .env.next
            echo "MIGRATOR_IMAGE=${MIGRATOR_IMAGE}" >> .env.next
            mv .env.next .env

            # 首次切换到独立 Web 数据库账号时，在 VPS 本地生成并持久化密码。
            # 密码不经过 Actions，也不会出现在日志里；后续部署沿用同一个值。
            if ! grep -qE '^APP_DATABASE_PASSWORD=.+$' .env; then
              APP_DATABASE_PASSWORD="$(openssl rand -hex 32)"
              grep -v '^APP_DATABASE_PASSWORD=' .env > .env.next || true
              printf 'APP_DATABASE_PASSWORD=%s\n' "${APP_DATABASE_PASSWORD}" >> .env.next
              chmod 600 .env.next
              mv .env.next .env
            fi
            chmod 600 .env

            # 登录 GHCR 拉私有镜像（token 仅本次运行有效）。
            echo "${REGISTRY_TOKEN}" | docker login ghcr.io -u "${REGISTRY_USER}" --password-stdin

            docker compose pull
            # migrate 是一次性服务；up -d 会先跑它成功后再起 web。
            docker compose up -d --remove-orphans --wait --wait-timeout 360

            # readiness 之外再走一次真实页面渲染；二者都成功才清理旧镜像。
            docker compose exec -T web node -e "Promise.all(['/api/health/ready','/'].map(path=>fetch('http://127.0.0.1:3000'+path).then(r=>{if(!r.ok)throw new Error(path+' returned '+r.status)})))"

            # 只清理本项目的旧镜像。绝不能用 `docker image prune -a`：同机的
            # tline 有大量按 sha 标记、当前未运行的镜像，那样会一并删掉。
            # 这里保留最近 3 个 gubugu 版本，其余删除。
            for repo in gubugu-web gubugu-migrator; do
              docker images "ghcr.io/${REGISTRY_OWNER}/${repo}" \
                --format '{{.ID}} {{.CreatedAt}}' | sort -k2 -r | tail -n +4 \
                | awk '{print $1}' | xargs -r docker rmi -f 2>/dev/null || true
            done
