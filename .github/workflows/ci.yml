name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # The build reads no environment variables: server/env.ts is only loaded
      # by instrumentation.ts at server start, and every data module falls back
      # to empty state when DATABASE_URL is absent. So CI needs no secrets.
      - run: pnpm build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gubugu
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gubugu
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:migrate

      - run: pnpm db:seed

      # The app connects as the table owner, which bypasses RLS, so nothing on
      # the request path would notice if these policies broke.
      - run: pnpm db:verify-rls

      # A clean migrate must leave the schema matching drizzle/schema. If this
      # fails, someone edited the schema without generating a migration.
      - name: Check for undeclared schema drift
        run: |
          pnpm db:generate
          if ! git diff --quiet -- drizzle/migrations; then
            echo "::error::drizzle/schema changed without a matching migration. Run pnpm db:generate and commit the result."
            git diff --stat -- drizzle/migrations
            exit 1
          fi
