name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - name: Check operations scripts
        run: sh -n ops/backup-production.sh

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high --registry=https://registry.npmjs.org

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gubugu
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gubugu
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:migrate

      - run: pnpm db:seed

      # The Web role uses BYPASSRLS for the current server-side session model,
      # so request-path tests alone would not notice if policies broke.
      - run: pnpm db:verify-rls

      - run: pnpm db:verify-trade

      - run: pnpm db:verify-lighting

      - name: Verify paired scan transactions
        run: pnpm exec vitest run server/user-scans/save.integration.test.ts
        env:
          RUN_DATABASE_TESTS: '1'

      # Exercise the real database-backed render path. A no-database build can
      # succeed while SQL or schema assumptions are broken.
      - run: pnpm build

      # A clean migrate must leave the schema matching drizzle/schema. If this
      # fails, someone edited the schema without generating a migration.
      - name: Check for undeclared schema drift
        run: |
          pnpm db:generate
          if ! git diff --quiet -- drizzle/migrations; then
            echo "::error::drizzle/schema changed without a matching migration. Run pnpm db:generate and commit the result."
            git diff --stat -- drizzle/migrations
            exit 1
          fi

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: pnpm install --frozen-lockfile

      - run: pnpm cap:sync

      - name: Test and bundle Android shell
        run: ./android/gradlew -p android test bundleRelease
